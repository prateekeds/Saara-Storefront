version: 1
indices:
  content:
    target: /content-index.json
    exclude:
      - '/blog/index'
    include:
      - /blog/**
      - /pages/**
    properties:
      title:
        select: head > meta[property="og:title"]
        value: |
          attribute(el, 'content')
      description:
        select: head > meta[name="description"]
        value: |
          attribute(el, 'content')
      lastModified:
        select: none
        value: |
          parseTimestamp(headers['last-modified'], 'ddd, DD MMM YYYY hh:mm:ss GMT')
      content:
        select: main
        value: |
          textContent(el)